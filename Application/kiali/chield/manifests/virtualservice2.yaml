apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: kiali-vs2
  namespace: kiali-operator
spec:
  hosts:
    - kiali2.kdvops.com
  gateways:
    - istio-system/kdvops-gateway

  http:
    - match:
        - uri:
            prefix: /kiali
      headers:
        request:
          set:
            X-Forwarded-Proto: "https"
            X-Forwarded-Port: "443"
            X-Forwarded-Host: "kiali2.kdvops.com"

      route:
        - destination:
            host: kiali.kiali-operator.svc.cluster.local
            port:
              number: 20001
