apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://charts.dexidp.io
      chart: dex
      targetRevision: 0.17.0
      helm:
        valueFiles:
          - $values/Application/dex/chield/manifests/values.yaml

    - repoURL: https://github.com/kdvops/ArgoCD.git
      targetRevision: HEAD
      ref: values
      path: Application/dex/chield/manifests


    
  destination:
    server: https://kubernetes.default.svc
    namespace: dex

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
