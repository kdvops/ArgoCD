apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex-root-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kdvops/ArgoCD.git
    targetRevision: HEAD
    path: Application/dex
    directory:
      recurse: true
      jsonnet: {}
      
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
