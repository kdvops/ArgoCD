# =========================
# Environment variables
# =========================
envFrom:
  - secretRef:
      name: dex-azure-secrets
  - secretRef:
      name: dex-kiali-secret

# =========================
# Dex configuration
# =========================
config:
  issuer: https://dex.kdvops.com

  storage:
    type: kubernetes
    config:
      inCluster: true

  web:
    http: "0.0.0.0:5556"

  oauth2:
    skipApprovalScreen: true

  staticClients:
    - id: kiali
      name: Kiali
      redirectURIs:
        - https://kiali.kdvops.com/kiali
        - https://kiali.kdvops.com/kiali/
        - https://kiali.kdvops.com/kiali/api/auth/openid_redirect
      secretEnv: KIALI_CLIENT_SECRET

  connectors:
    - type: microsoft
      id: azure
      name: Azure Entra ID
      config:
        clientID: ${AZURE_CLIENT_ID}
        clientSecret: ${AZURE_CLIENT_SECRET}
        tenant: ${AZURE_TENANT_ID}
        redirectURI: https://dex.kdvops.com/callback


